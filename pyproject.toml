# ============================================================
# pyproject.toml - ApolloTab Python包配置
# 用途: 定义PyPI发布所需的元数据、依赖和构建配置
# 构建工具: setuptools + wheel (兼容Python 3.11+)
# 安装命令: pip install .
# 发布命令: python -m build && twine upload dist/*
# 创建日期: 2026-06-12
# ============================================================

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ApolloTab"
version = "1.3.1"
description = "Guitar Pro file parsing, rendering, and audio playback engine library"
readme = "README.md"
license = "LGPL-2.1"
authors = [
    {name = "ZhuWenqian"}
]
maintainers = [
    {name = "ZhuWenqian"}
]
keywords = [
    "guitar-pro",
    "gtp",
    "tab",
    "music",
    "midi",
    "renderer",
    "audio",
    "synth",
    "guitar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
requires-python = ">=3.8"

# 核心依赖（安装时自动安装）
dependencies = [
    "pyguitarpro>=0.10.1",    # Guitar Pro文件解析（开源项目: pyguitarpro）
    # "PyQt5>=5.15",          # GUI渲染框架（用于生成QPixmap图像）
    #   注: ARM架构需通过apt安装PyQt5后手动创建软链接，pip无法直接安装
    "pyfluidsynth>=1.4.0",    # FluidSynth Python绑定（音频合成）
]

# 可选依赖组
[project.optional-dependencies]
# 完整功能（含所有可选特性）
full = [
    "pyguitarpro>=0.10.1",
    # "PyQt5>=5.15",
    "pyfluidsynth>=1.4.0",
]
# 开发环境（测试、lint、构建）
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/Zhuwenqian/ApolloTab"
Documentation = "https://github.com/Zhuwenqian/ApolloTab#readme"
Repository = "https://github.com/Zhuwenqian/ApolloTab.git"
Issues = "https://github.com/Zhuwenqian/ApolloTab/issues"
[tool.setuptools]
# 自动发现所有子包（parser/renderer/audio/models/utils）
[tool.setuptools.packages.find]
where = ["."]
exclude = ["venv*", "tests*", "__pycache__*"]

# 包发现模式
[tool.setuptools.package-data]
"ApolloTab" = ["*.pyi", "py.typed"]

# 黑代码格式化配置
[tool.black]
line-length = 100
target-version = ["py38"]

# isort导入排序配置
[tool.isort]
profile = "black"
line_length = 100

# mypy类型检查配置
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
