# ============================================================
# pyproject.toml - ApolloTab Python包配置
# 用途: 定义PyPI发布所需的元数据、依赖和构建配置
# 构建工具: setuptools + wheel (兼容Python 3.11+)
# 安装命令: pip install .
# 发布命令: python -m build && twine upload dist/*
# 创建日期: 2026-06-12
# ============================================================

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ApolloTab"
version = "1.4.0"
description = "Guitar Pro file parsing, rendering, and audio playback engine library"
readme = "README.md"
license = "LGPL-2.1"
authors = [
    {name = "ZhuWenqian"}
]
maintainers = [
    {name = "ZhuWenqian"}
]
keywords = [
    "guitar-pro",
    "gtp",
    "tab",
    "music",
    "midi",
    "renderer",
    "audio",
    "synth",
    "guitar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
requires-python = ">=3.11"

# 核心依赖（安装时自动安装）
dependencies = [
    "pyguitarpro>=0.10.1",    # Guitar Pro文件解析（开源项目: pyguitarpro）
    # "PyQt5>=5.15",          # GUI渲染框架（用于生成QPixmap图像）
    #   注: ARM架构需通过apt安装PyQt5后手动创建软链接，pip无法直接安装
    "pyfluidsynth>=1.4.0",    # FluidSynth Python绑定（音频合成）
]

# 可选依赖组
[project.optional-dependencies]
# 完整功能（含所有可选特性）
full = [
    "pyguitarpro>=0.10.1",
    # "PyQt5>=5.15",
    "pyfluidsynth>=1.4.0",
]
# 开发环境（测试、lint、构建）
# v1.4.1: ruff 全权接管 lint + format，移除 black/isort
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/Zhuwenqian/ApolloTab"
Documentation = "https://github.com/Zhuwenqian/ApolloTab#readme"
Repository = "https://github.com/Zhuwenqian/ApolloTab.git"
Issues = "https://github.com/Zhuwenqian/ApolloTab/issues"
[tool.setuptools]
# 自动发现所有子包（parser/renderer/audio/models/utils）
[tool.setuptools.packages.find]
where = ["."]
exclude = ["venv*", "tests*", "__pycache__*"]

# 包发现模式
[tool.setuptools.package-data]
"ApolloTab" = ["*.pyi", "py.typed"]

# ============================================================
# ruff 配置 (v1.4.1: 全权接管 lint + format，替代 black/isort)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "dist", "build", "ApolloTab.egg-info"]

[tool.ruff.lint]
# 规则集选择:
#   E/W = pycodestyle (PEP8 风格)
#   F   = Pyflakes (逻辑错误，未使用变量等)
#   I   = isort (导入排序，替代独立 isort 工具)
#   UP  = pyupgrade (现代化语法)
#   B   = flake8-bugbear (常见陷阱)
#   SIM = flake8-simplify (代码简化)
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # 行过长: 由 ruff format 处理换行，不强制 lint 报错(存量代码有长行)
    "F401",   # 未使用 import: 本库为公开发布库，__init__.py 的 re-export 与公共 API 难以静态判定使用方，故全局忽略
    "E741",   # 模糊变量名(l/I/O): 音乐领域单字母变量常见(如弦序 i)，暂忽略
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许使用魔法值、断言、较长函数
"ApolloTab/tests/*" = ["E402", "B011"]

[tool.ruff.format]
# 与原 black 风格保持一致，平滑过渡
quote-style = "preserve"
indent-style = "space"
docstring-code-format = false

# ============================================================
# pytest 配置 (v1.4.1 新增)
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["ApolloTab/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# coverage: 测 ApolloTab 包，终端输出缺失行，未达 40% 则失败
addopts = "-ra --cov=ApolloTab --cov-report=term-missing --cov-fail-under=40"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# mypy类型检查配置
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
